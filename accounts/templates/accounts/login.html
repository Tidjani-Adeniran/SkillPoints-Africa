{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SkillPoints Africa</title>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
  <link rel="stylesheet" href="{% static 'core/accounts.css' %}">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p>Log in to access your tracking dashboard.</p>
      
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn signup btn-submit">Secure Login</button>
      </form>

      <div class="switch-text">
        New to the platform? <a href="{% url 'signup' %}">Sign up here</a>
      </div>
    </div>
  </div>

</body>
</html>
