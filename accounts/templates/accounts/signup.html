{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SkillPoints Africa</title>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
  <link rel="stylesheet" href="{% static 'core/accounts.css' %}">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Join SkillPoints Africa to start earning rewards.</p>
      
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn signup btn-submit">Register Account</button>
      </form>

      <div class="switch-text">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
      </div>
    </div>
  </div>

</body>
</html>
